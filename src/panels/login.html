<div class="container">
    <div class="login-home login-tabs">
        <div class="login-text">Oynamak için lütfen giriş yapın.</div>

        <div class="login-options">
            <button class="connect connect-home">Bağlantı</button>
            <button class="cancel cancel-home"  style="display: none;">iptal et</button>
        </div>
    </div>

    <div class="login-offline login-tabs">
        <div class="login-text">Lütfen kullanıcı adınızı girin</div>

        <div class="input-login">
            <input type="text" class="email email-offline" placeholder="Kullanıcı Adınız" />
        </div>

        <div class="login-options">
            <button class="connect connect-offline">Oyna</button>
            <button class="cancel cancel-offline" style="display: none;">iptal et</button>
        </div>
    </div>

    <div class="login-AZauth login-tabs">
        <div class="login-text">Oynamak için lütfen giriş yapın.</div>

        <div class="input-login">
            <input type="text" class="email email-AZauth" placeholder="E-mail" />
            <input type="password" class="password password-AZauth" placeholder="Password" />
        </div>

        <div class="login-options">
            <button class="connect connect-AZauth">Bağlantı</button>
            <button class="cancel cancel-AZauth" style="display: none;">iptal et</button>
        </div>
    </div>

    <div class="login-AZauth-A2F login-tabs">
        <div class="login-text">Lütfen güvenlik kodunu girin.</div>

        <div class="input-login">
            <input type="text" class="A2F A2F-AZauth" placeholder="Code" />
        </div>

        <div class="login-options">
            <button class="connect connect-AZauth-A2F">Onaylayın</button>
            <button class="cancel cancel-AZauth-A2F">iptal et</button>
        </div>
    </div>
</div>
